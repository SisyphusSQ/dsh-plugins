# dsh-session-tools mounts the bounded snapshot resolver, then the model-facing
# tools and @session pre-step adapter. The Web client entry is declared on the
# package, not this patch. Row order is documentary; Cordis activation waits
# for injected services.

- insert:
    - id: session-reference-resolver
      name: '@deepseek-ai/dsh-session-reference'

    - id: session-tools
      name: 'dsh-session-tools'
